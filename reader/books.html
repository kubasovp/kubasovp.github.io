<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Моя библиотека — Reader</title>
    <link rel="stylesheet" href="styles.css?v=6" />
  </head>
  <body>
    <main class="library" aria-labelledby="library-title">
      <details class="library-switcher">
        <summary class="library-switcher__summary">
          <h1 class="library__title" id="library-title">Моя библиотека</h1>
        </summary>
        <nav class="library-switcher__menu" aria-label="Разделы библиотеки">
          <a class="library-switcher__item" href="reading.html">Читаю сейчас</a>
        </nav>
      </details>

      <div class="library__toolbar">
        <p class="library__subtitle">Все книги · по автору</p>
        <a class="button button_outline" href="add-book.html">Добавить книгу</a>
      </div>

      <div class="author-list">
        <section class="author-card" aria-labelledby="author-ushinsky">
          <h2 class="author-card__title" id="author-ushinsky">Константин Дмитриевич Ушинский</h2>
          <ul class="author-card__books">
            <li class="author-card__book">
              <span>Четыре желания</span>
              <a class="button button_text author-card__action" href="index.html">читать</a>
            </li>
            <li class="author-card__book">
              <span>Репка</span>
              <a class="button button_text author-card__action" href="index.html">читать</a>
            </li>
          </ul>
        </section>

        <section class="author-card" aria-labelledby="author-shipton">
          <h2 class="author-card__title" id="author-shipton">Vicky Shipton</h2>
          <ul class="author-card__books">
            <li class="author-card__book">
              <span>Daniel Radcliffe</span>
              <a class="button button_text author-card__action" href="index.html">читать</a>
            </li>
          </ul>
        </section>

        <section class="author-card" aria-labelledby="author-chang">
          <h2 class="author-card__title" id="author-chang">Ха-Джун Чанг</h2>
          <ul class="author-card__books">
            <li class="author-card__book">
              <span>Как устроена экономика</span>
              <a class="button button_text author-card__action" href="index.html">читать</a>
            </li>
          </ul>
        </section>
      </div>
    </main>
  </body>
</html>
